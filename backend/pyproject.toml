[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends() y Query() en los argumentos es el patron normal de FastAPI.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.coverage.run]
# La cobertura se mide sobre la logica de negocio: servicios y regla FEFO.
include = ["app/*/*service*.py", "app/inventario/fefo.py", "app/inventario/stock.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
